# Vago iPhone app — XcodeGen fragment, included by project.yml.
#
# Paths are relative to the repository root (project.yml includes this file with
# `relativePaths: false`). Targets and bundle ids follow the table in docs/ARCHITECTURE.md.
#
# iPhone only, portrait only. XcodeGen's iOS target default for TARGETED_DEVICE_FAMILY is
# "1,2" and overrides a project-level "1", so every target gets the value through the
# template below, which is target-level (POLICY section 15).

targetTemplates:
  VagoPhone:
    platform: iOS
    deploymentTarget: "26.0"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      - package: VagoKit
        product: VagoKit

  VagoPhoneExtension:
    templates: [VagoPhone]
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

targets:
  Vago:
    templates: [VagoPhone]
    type: application
    sources:
      - path: iOS/App
      - path: iOS/Shared
      - path: iOS/SharedUI
      - path: iOS/PrivacyInfo.xcprivacy
    dependencies:
      - target: VagoMonitor
      - target: VagoShield
      - target: VagoShieldAction
      - target: VagoReport
      - target: VagoWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago
        PRODUCT_NAME: Vago
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: iOS/App/Vago.entitlements
    info:
      path: iOS/App/Info.plist
      properties:
        CFBundleDisplayName: Vago
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: iOS/App/Vago.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zaitsew.vago
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.zaitsew.vago

  # Counts: the system calls it when a usage threshold is reached.
  VagoMonitor:
    templates: [VagoPhoneExtension]
    type: app-extension
    sources:
      - path: iOS/Monitor
      - path: iOS/Shared
      - path: iOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago.monitor
        PRODUCT_NAME: VagoMonitor
        CODE_SIGN_ENTITLEMENTS: iOS/Monitor/VagoMonitor.entitlements
    info:
      path: iOS/Monitor/Info.plist
      properties:
        CFBundleDisplayName: Vago Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).VagoMonitorExtension
    entitlements:
      path: iOS/Monitor/VagoMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zaitsew.vago

  # What the "Work or scroll?" and focus shields say.
  VagoShield:
    templates: [VagoPhoneExtension]
    type: app-extension
    sources:
      - path: iOS/Shield
      - path: iOS/Shared
      - path: iOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago.shield
        PRODUCT_NAME: VagoShield
        CODE_SIGN_ENTITLEMENTS: iOS/Shield/VagoShield.entitlements
    info:
      path: iOS/Shield/Info.plist
      properties:
        CFBundleDisplayName: Vago Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).VagoShieldConfigurationExtension
    entitlements:
      path: iOS/Shield/VagoShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zaitsew.vago

  # What the shield's buttons do.
  VagoShieldAction:
    templates: [VagoPhoneExtension]
    type: app-extension
    sources:
      - path: iOS/ShieldAction
      - path: iOS/Shared
      - path: iOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago.shieldaction
        PRODUCT_NAME: VagoShieldAction
        CODE_SIGN_ENTITLEMENTS: iOS/ShieldAction/VagoShieldAction.entitlements
    info:
      path: iOS/ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Vago Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).VagoShieldActionExtension
    entitlements:
      path: iOS/ShieldAction/VagoShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zaitsew.vago

  # Screen Time's own per-app totals. An ExtensionKit extension (it lives in Extensions/, not PlugIns/).
  VagoReport:
    templates: [VagoPhoneExtension]
    type: extensionkit-extension
    sources:
      - path: iOS/Report
      - path: iOS/Shared
      - path: iOS/SharedUI
      - path: iOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago.report
        PRODUCT_NAME: VagoReport
        CODE_SIGN_ENTITLEMENTS: iOS/Report/VagoReport.entitlements
    info:
      path: iOS/Report/Info.plist
      properties:
        CFBundleDisplayName: Vago Report
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
    entitlements:
      path: iOS/Report/VagoReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zaitsew.vago

  # The widget and the Live Activity UI (with the Dynamic Island).
  VagoWidgets:
    templates: [VagoPhoneExtension]
    type: app-extension
    sources:
      - path: iOS/Widgets
      - path: iOS/Shared
      - path: iOS/SharedUI
      - path: iOS/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaitsew.vago.widgets
        PRODUCT_NAME: VagoWidgets
        CODE_SIGN_ENTITLEMENTS: iOS/Widgets/VagoWidgets.entitlements
    info:
      path: iOS/Widgets/Info.plist
      properties:
        CFBundleDisplayName: Vago Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: iOS/Widgets/VagoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.zaitsew.vago

schemes:
  Vago:
    build:
      targets:
        Vago: all
    run:
      config: Debug
    archive:
      config: Release
